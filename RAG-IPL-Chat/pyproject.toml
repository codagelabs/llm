[project]
name = "rag-ipl-chat"
version = "0.2.0"
description = "IPL cricket RAG chatbot — query ball-by-ball match data using ChromaDB + OpenAI embeddings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.3.0",
    "langchain-core>=1.4.8",
    "langchain-openai>=1.3.2",
    "litellm>=1.90.0",
    "nbformat>=5.10.4",
    "numpy>=2.4.6",
    "openai>=2.43.0",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.9.0",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
ipl-chat = "main:main"
ipl-ingest = "src.ingest:ingest"
